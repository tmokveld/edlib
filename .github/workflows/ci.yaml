name: CI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

jobs:
  cpp_edlib:
    name: "C++ (${{ matrix.os }}, ${{ matrix.cxx }})"
    strategy:
      matrix:
        include:
          # GCC on Linux and Apple Clang on ARM64 cover the regular builds.
          # Linux Clang is covered separately by the sanitizer job.
          - { os: ubuntu-24.04, cc: gcc-14, cxx: g++-14 }
          - { os: macos-15, cc: clang, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools meson ninja

      - name: Build binaries and libraries and test them (with Meson)
        run: |
          make CXXFLAGS="-Werror" LIBRARY_TYPE=static BUILD_DIR=meson-build-static
          make CXXFLAGS="-Werror" LIBRARY_TYPE=shared BUILD_DIR=meson-build-shared

          # Check for memory leaks.
          # I run this only on linux because osx returns errors from
          # system libraries, which I would have to supress.
          if [ ${{ runner.os }} == "Linux" ]; then
            make check-memory-leaks BUILD_DIR=meson-build-static
          fi

      - name: Build binaries and libraries and test them (with CMake)
        run: |
          mkdir -p build && cd build
          CXXFLAGS="-Werror" cmake -GNinja ..
          ninja -v
          bin/runTests

  cpp_edlib_sanitizers:
    name: "Check CPP edlib with AddressSanitizer and UndefinedBehaviorSanitizer"
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools meson ninja

      - name: Test benchmark report comparisons
        run: python -m unittest discover -s benchmarks -p 'test_*.py'

      - name: Build and test with sanitizers
        run: make sanitizer

      - name: Exercise benchmark inputs with sanitizers
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          meson compile -C build/sanitizer edlib-benchmark
          python benchmarks/run.py --binary build/sanitizer/edlib-benchmark \
            --suite smoke --samples 1 --sample-ms 1 \
            --output build/sanitizer/benchmark-smoke.json

